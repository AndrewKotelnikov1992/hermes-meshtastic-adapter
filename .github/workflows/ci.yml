name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Hermes Agent and plugin dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'hermes-agent>=0.19,<0.20'
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: PYTHONPATH=. pytest -q
